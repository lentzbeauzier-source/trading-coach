<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Coach</title>
<style>
:root{--bg:#0e1411;--sf:#17201b;--sf2:#1f2b24;--tx:#e8efe9;--mu:#8fa397;--up:#2fcf7f;--dn:#ef5b5b;--ac:#e5b94a;--bl:#5aa9ff;--bd:#2b3a31;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f2f5f2;--sf:#fff;--sf2:#e6ede7;--tx:#14201a;--mu:#5b6d62;--up:#12995a;--dn:#d23c3c;--ac:#a97c00;--bl:#1f6fd1;--bd:#cfdad2}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
#v{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:18px 0 8px}p{margin:6px 0}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font-size:.64rem;font-family:inherit}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
nav b{display:block;font-size:1.2rem}
.btn{background:var(--ac);color:#111;border:0;border-radius:12px;padding:14px 18px;font-size:1rem;font-weight:700;font-family:inherit;width:100%;margin-top:8px}
.btn.g{background:var(--sf2);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg button{background:var(--sf2);color:var(--mu);border:0;border-radius:10px;padding:11px 4px;font-family:inherit;font-size:.9rem}
.seg button.on{background:var(--ac);color:#111;font-weight:700}
input,select{width:100%;background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:1rem;font-family:inherit;margin:4px 0 8px}
label{font-size:.85rem;color:var(--mu)}
.chk{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--bd);font-size:1rem}
.chk input{width:24px;height:24px;margin:0}
.ok{color:var(--up)}.no{color:var(--dn)}
.verdict{text-align:center;font-size:1.25rem;font-weight:700;padding:16px;border-radius:14px;margin-top:12px}
details{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
summary{font-weight:700}
svg{width:100%;height:auto;display:block;background:var(--sf);border:1px solid var(--bd);border-radius:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{font-size:1.3rem;display:block}
.warn{font-size:.78rem;color:var(--mu);margin-top:20px;border-top:1px solid var(--bd);padding-top:10px}
.msg{padding:10px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap}.msg.u{background:var(--sf2);margin-left:28px}.msg.a{background:var(--sf);border:1px solid var(--bd);margin-right:28px}
</style>
</head>
<body>
<div id="v"></div>
<nav id="n"></nav>
<script>
const $=s=>document.querySelector(s);
let tab='cours',kind='buy',step=0,vis=9,jr=[];
try{jr=JSON.parse(localStorage.getItem('tc_j')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('tc_j',JSON.stringify(jr))}catch(e){}};
const TABS=[['cours','📈','Cours'],['check','✅','Check'],['prat','🎯','Pratique'],['coach','🤖','Coach'],['lot','🧮','Lot'],['journ','📓','Journal'],['news','📰','News']];
const C=[[50,53,49,52],[52,56,51,55],[55,58,54,57],[57,59,53,54],[54,55,50,51],[51,52,46.5,51.5],[51.5,56,51,55],[55,60,54,59],[59,64,58,63]];
function chart(k,n){
 const sell=k==='sell',bad=k==='bad',m=p=>sell?100-p:p;
 const cs=C.map(c=>[m(c[0]),m(c[2]),m(c[1]),m(c[3])]);
 const E=bad?57:m(51.5),SL=m(46),TP=m(62.5),Z=[m(47),m(50)].sort((a,b)=>a-b),T=[m(62),m(64)].sort((a,b)=>a-b);
 const all=cs.flat().concat([SL,TP]),lo=Math.min(...all)-2,hi=Math.max(...all)+2,W=320,H=210;
 const y=p=>(H-14)-(p-lo)/(hi-lo)*(H-28)+7,x=i=>24+i*32;
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 if(!bad){
  s+=`<rect x="0" y="${y(Z[1])}" width="${W}" height="${y(Z[0])-y(Z[1])}" fill="${sell?'var(--dn)':'var(--up)'}" opacity=".18"/><text x="6" y="${y(Z[1])-3}" font-size="9" fill="var(--mu)">${sell?'Résistance':'Support'}</text>`;
  s+=`<rect x="0" y="${y(T[1])}" width="${W}" height="${y(T[0])-y(T[1])}" fill="var(--mu)" opacity=".15"/><text x="6" y="${y(T[1])-3}" font-size="9" fill="var(--mu)">Prochain niveau</text>`;
 }
 cs.slice(0,n).forEach((c,i)=>{const up=c[3]>=c[0],col=up?'var(--up)':'var(--dn)';
  s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(c[2])}" y2="${y(c[1])}" stroke="${col}" stroke-width="2"/><rect x="${x(i)-8}" y="${y(Math.max(c[0],c[3]))}" width="16" height="${Math.max(2,Math.abs(y(c[0])-y(c[3])))}" fill="${col}"/>`});
 if(!bad&&n>=6)s+=`<ellipse cx="${x(5)}" cy="${y((cs[5][1]+cs[5][2])/2)}" rx="14" ry="${Math.abs(y(cs[5][1])-y(cs[5][2]))/2+5}" fill="none" stroke="var(--ac)" stroke-width="2"/><text x="${x(5)-14}" y="${y(cs[5][sell?2:1])+(sell?-8:16)}" font-size="9" fill="var(--ac)">Rejet</text>`;
 const ei=bad?3:6;
 if(n>=ei){
  const L=(p,c,t,d)=>`<line x1="${x(ei-1)}" x2="${W}" y1="${y(p)}" y2="${y(p)}" stroke="${c}" stroke-width="1.5" ${d?'stroke-dasharray="4 3"':''}/><text x="${W-4}" y="${y(p)-3}" font-size="9" text-anchor="end" fill="${c}">${t}</text>`;
  if(!bad){s+=`<rect x="${x(ei-1)}" y="${Math.min(y(E),y(SL))}" width="${W-x(ei-1)}" height="${Math.abs(y(E)-y(SL))}" fill="var(--dn)" opacity=".15"/><rect x="${x(ei-1)}" y="${Math.min(y(E),y(TP))}" width="${W-x(ei-1)}" height="${Math.abs(y(E)-y(TP))}" fill="var(--up)" opacity=".15"/>`+L(SL,'var(--dn)','Stop loss',1)+L(TP,'var(--up)','Take profit 1:2',1)}
  s+=L(E,'var(--bl)','Entrée',0);
  if(bad)s+=`<text x="${W/2}" y="20" font-size="11" text-anchor="middle" fill="var(--dn)">❌ Au milieu de nulle part, sans stop loss</text>`;
 }
 return s+'</svg>';
}
const STEPS=[
['1. Tendance (M15)','Regarde le M15. Sommets et creux de plus en plus hauts : tendance haussière, on ne cherche que des achats. De plus en plus bas : on ne cherche que des ventes. Pas de tendance claire : on ne trade pas.'],
['2. Niveaux clés','Trace les supports et résistances sur M15 : des zones où le prix a réagi au moins 2 fois. Ce sont des zones, pas des lignes fines.'],
['3. Attendre','Laisse le prix revenir sur un niveau. Jamais de trade au milieu de nulle part. Attendre fait partie de la stratégie.'],
['4. Confirmation (M1)','Entre seulement après une bougie de rejet sur le niveau : pin bar (longue mèche), avalement. Appuie sur Suivant pour voir la bougie se former.'],
['5. Stop loss','Place-le juste au-delà du niveau ou de la mèche du rejet. Jamais de trade sans stop loss, et jamais de stop retiré ou éloigné.'],
['6. Take profit','Vise le prochain niveau, avec au moins 2 fois ton risque (ratio 1:2). La zone rouge est ce que tu risques, la verte ce que tu peux gagner.'],
['7. Risque','1 à 2 % du capital maximum par trade. Un seul trade à la fois. Après 2 pertes de suite, tu arrêtes la journée.'],
['8. À éviter','Pas de trade avant ou pendant une grosse news, ni quand le volume est faible. Compare à droite : bon trade, mauvais trade.']];
function cours(){
 const [t,d]=STEPS[step];
 return `<h1>Cours</h1><p class="mu">Stratégie : Support/Résistance + Confirmation</p>
 <div class="row seg" style="margin:10px 0">${[['buy','Achat'],['sell','Vente'],['bad','Mauvais trade']].map(a=>`<button class="${kind===a[0]?'on':''}" onclick="kind='${a[0]}';vis=9;go()">${a[1]}</button>`).join('')}</div>
 ${chart(kind,vis)}
 <div class="row"><button class="btn g" onclick="vis=Math.max(1,vis-1);go()">◀ Retour</button><button class="btn" onclick="vis=vis>=9?1:vis+1;go()">Suivant ▶</button></div>
 <p class="mu" style="text-align:center">Bougie ${vis} sur 9</p>
 <div class="card"><h2 style="margin-top:0">${t}</h2><p>${d}</p></div>
 <div class="row"><button class="btn g" ${step?'':'disabled'} onclick="step--;go()">Étape précédente</button><button class="btn g" ${step<7?'':'disabled'} onclick="step++;go()">Étape suivante</button></div>
 <p class="warn">Les graphiques sont des exemples fictifs pour apprendre. Le trading comporte un risque de perte en capital. Cette app est éducative et ne garantit aucun gain.</p>`;
}
const CK=['La tendance M15 est claire et je trade dans son sens','Le prix est sur un niveau clé (support ou résistance)','Une bougie de rejet est confirmée sur M1','Mon stop loss est placé et le ratio est au moins 1:2','Mon risque est de 2 % maximum et aucun trade n’est ouvert','Aucune grosse news dans les 30 prochaines minutes'];
let ck=CK.map(()=>false);
function check(){
 const all=ck.every(Boolean);
 return `<h1>Checklist</h1><p class="mu">Avant chaque trade, coche tout. Une case vide, tu n’entres pas.</p>
 <div class="card">${CK.map((t,i)=>`<label class="chk"><input type="checkbox" ${ck[i]?'checked':''} onchange="ck[${i}]=this.checked;go()"><span style="color:var(--tx);font-size:1rem">${t}</span></label>`).join('')}</div>
 <div class="verdict" style="background:${all?'var(--up)':'var(--dn)'};color:#111">${all?'✅ Tu peux entrer':'⛔ Ne pas entrer'}</div>
 <button class="btn g" onclick="ck=CK.map(()=>false);go()">Tout décocher</button>`;
}
let L={cap:'',risk:'1',pair:'XAU',sl:''};
function lot(){
 const val=L.pair==='XAU'?100:10,cap=+L.cap,r=+L.risk,sl=+L.sl;let out='';
 if(cap>0&&r>0&&sl>0){
  const rd=cap*r/100,raw=rd/(sl*val),lt=Math.floor(raw*100)/100;
  out=`<div class="card"><p>Risque : <b>${rd.toFixed(2)} $</b></p><p style="font-size:1.6rem;margin:6px 0">Lot : <b class="${lt<0.01?'no':'ok'}">${lt>=0.01?lt.toFixed(2):'moins de 0.01'}</b></p>
  ${lt<0.01?'<p class="no">Capital trop petit pour ce stop loss. Réduis la distance du stop ou ne trade pas.</p>':''}
  ${r>2?'<p class="no">Attention : plus de 2 % de risque, c’est trop pour la stratégie.</p>':''}</div>`;
 }
 return `<h1>Calculateur de lot</h1><p class="mu">Combien de lots pour ne risquer que ton pourcentage.</p>
 <div class="card"><label>Capital ($)</label><input type="number" inputmode="decimal" value="${L.cap}" oninput="L.cap=this.value" onchange="go()">
 <label>Risque par trade (%)</label><input type="number" inputmode="decimal" value="${L.risk}" oninput="L.risk=this.value" onchange="go()">
 <label>Paire</label><select onchange="L.pair=this.value;go()"><option value="XAU" ${L.pair==='XAU'?'selected':''}>XAUUSD (stop en $ de prix)</option><option value="EUR" ${L.pair==='EUR'?'selected':''}>EURUSD (stop en pips)</option></select>
 <label>Stop loss (${L.pair==='XAU'?'dollars de prix, ex. 3':'pips, ex. 8'})</label><input type="number" inputmode="decimal" value="${L.sl}" oninput="L.sl=this.value" onchange="go()"></div>${out}
 <p class="mu">Estimation standard : 1 lot or = 100 oz, 1 lot EURUSD = 10 $ par pip. Vérifie la valeur dans ton MT5.</p>`;
}
function journ(){
 const n=jr.length,w=jr.filter(t=>t.r>0),l=jr.filter(t=>t.r<0),f=a=>a.length?(a.reduce((s,t)=>s+t.r,0)/a.length).toFixed(2):'0';
 return `<h1>Journal</h1><div class="card"><div class="row"><div><label>Paire</label><select id="jp"><option>XAUUSD</option><option>EURUSD</option></select></div><div><label>Sens</label><select id="js"><option>Achat</option><option>Vente</option></select></div></div>
 <label>Résultat ($, négatif si perte)</label><input id="jr" type="number" inputmode="decimal">
 <label>Émotion</label><select id="je"><option>Calme</option><option>Confiant</option><option>Peur</option><option>Pressé</option><option>Vengeance</option></select>
 <label class="chk" style="border:0;padding:6px 0"><input id="jsl" type="checkbox"><span style="font-size:1rem;color:var(--tx)">J’ai utilisé un stop loss</span></label>
 <button class="btn" onclick="addJ()">Enregistrer le trade</button></div>
 <div class="stat"><div><span class="mu">Trades</span><b>${n}</b></div><div><span class="mu">Réussite</span><b>${n?Math.round(w.length/n*100):0} %</b></div><div><span class="mu">Gain moyen</span><b class="ok">${f(w)} $</b></div><div><span class="mu">Perte moyenne</span><b class="no">${f(l)} $</b></div><div style="grid-column:span 2"><span class="mu">Trades avec stop loss</span><b>${n?Math.round(jr.filter(t=>t.sl).length/n*100):0} %</b></div></div>
 ${jr.slice().reverse().map(t=>`<div class="card"><b>${t.p} ${t.s}</b> <span class="${t.r>=0?'ok':'no'}">${t.r>=0?'+':''}${t.r} $</span><br><span class="mu">${t.d} · ${t.e} · ${t.sl?'avec stop':'SANS stop'}</span></div>`).join('')}
 ${n?'<button class="btn g" onclick="if(confirm(\'Tout effacer ?\')){jr=[];save();go()}">Effacer le journal</button>':'<p class="mu">Aucun trade enregistré. Note ton premier trade ci-dessus.</p>'}`;
}
function addJ(){const r=parseFloat($('#jr').value);if(isNaN(r)){alert('Entre le résultat en dollars.');return}
 jr.push({p:$('#jp').value,s:$('#js').value,r,e:$('#je').value,sl:$('#jsl').checked,d:new Date().toLocaleDateString('fr-FR')});save();go()}
const NW=[
['NFP (emploi américain)','Publié le 1er vendredi du mois. Emplois créés meilleurs que prévu : le dollar monte, l’or et l’EURUSD baissent souvent. Pire que prévu : l’inverse.'],
['CPI (inflation américaine)','Inflation plus forte que prévu : le marché attend des taux élevés plus longtemps, donc dollar en hausse, or et EURUSD sous pression. Inflation plus faible : souvent l’inverse.'],
['Décision de taux de la Fed','Taux plus haut ou ton ferme : dollar fort. Ton prudent ou baisse de taux : dollar faible, l’or et l’EURUSD montent souvent. Le discours compte autant que le chiffre.'],
['Décision de taux de la BCE','Ton ferme de la BCE : l’euro se renforce, l’EURUSD monte. Ton prudent : l’euro faiblit. Compare toujours avec la Fed.'],
['PIB et ventes au détail','Ils montrent la santé de l’économie. Chiffres forts : monnaie du pays en hausse. Chiffres faibles : monnaie en baisse.'],
['Peur sur les marchés','En cas de crise ou de tension mondiale, l’or sert de valeur refuge et peut monter même si le dollar monte.']];
function news(){
 return `<h1>Marchés et news</h1>
 <div class="card"><h2 style="margin-top:0">Comment bouge le prix</h2><p>Plus d’acheteurs que de vendeurs : le prix monte. L’inverse : il baisse. Les banques et institutions pèsent le plus. Le prix bouge surtout pendant les sessions de Londres et de New York, et peu pendant la session d’Asie.</p></div>
 <h2>Les news qui font bouger l’or et l’EURUSD</h2>${NW.map(a=>`<details><summary>${a[0]}</summary><p>${a[1]}</p></details>`).join('')}
 <div class="card"><h2 style="margin-top:0">Autour d’une news</h2><p>Calme avant, pic de volatilité à la publication, faux mouvements, spread plus large, puis retour progressif à la tendance.</p>
 <svg viewBox="0 0 320 90"><path d="M10 50 L90 48 L130 50 L150 12 L165 80 L185 28 L215 55 L260 45 L310 38" fill="none" stroke="var(--bl)" stroke-width="2.5"/><line x1="150" x2="150" y1="5" y2="85" stroke="var(--ac)" stroke-dasharray="4 3"/><text x="153" y="86" font-size="9" fill="var(--ac)">News</text><text x="30" y="75" font-size="9" fill="var(--mu)">Calme</text><text x="195" y="82" font-size="9" fill="var(--mu)">Stabilisation</text></svg>
 <p class="no"><b>Règle d’or :</b> pas de trade juste avant ou pendant une grosse news. Attends que le prix se stabilise, puis cherche ta confirmation sur M1 au niveau clé.</p></div>
 <p class="warn">Ces réactions sont des tendances habituelles, pas des garanties. Vérifie l’heure des news dans un calendrier économique avant de trader. Le trading comporte un risque de perte en capital.</p>`;
}
let pm='sim',si=0,sa=null,ss=0,sn=0,qi=0,qa=null,qs=0;
const mir=(S,e)=>{const f=k=>[100-k[0],100-k[2],100-k[1],100-k[3]];return{z:[100-S.z[1],100-S.z[0],S.z[2]==='S'?'R':'S'],c:S.c.map(f),f:S.f.map(f),a:S.a==='buy'?'sell':'buy',e}};
const B1={z:[47,50,'S'],c:C.slice(0,6),f:C.slice(6),a:'buy',e:'Tendance haussière, retour sur le support, puis pin bar de rejet : toutes les conditions sont là. Le prix est reparti à la hausse.'};
const B2={z:[48,50.5,'S'],c:[[52,56,51,55],[55,58,54,57],[57,58,53,54],[54,54.5,50,50.5],[50.5,51,49,49.5],[49.2,54,48.8,53.5]],f:[[53.5,57,53,56.5],[56.5,60,56,59]],a:'buy',e:'Tendance haussière, petit recul sur le support, puis bougie d’avalement haussière : c’est une confirmation. Achat valide, stop sous la mèche.'};
const SC=[B1,{z:[40,43,'S'],c:[[50,52,49,51],[51,53,50,50.5],[50.5,52,49.5,51.5],[51.5,52.5,50,50.8],[50.8,52,50,51.2]],f:[[51.2,54,50.5,53],[53,53.5,49,49.5],[49.5,51,48.5,50.5]],a:'wait',e:'Le prix est au milieu de nulle part, loin de tout niveau et sans tendance. Aucun signal : on attend. Le prix est reparti dans les deux sens.'},mir(B1,'Tendance baissière, retour sur la résistance, puis rejet : la vente est valide. Le prix est reparti à la baisse.'),{z:[46,50,'S'],c:[[58,59,55,56],[56,57,52,53],[53,54,49.5,50],[50,50.5,46,47]],f:[[47,48,41,42],[42,44,38,39],[39,41,37,40]],a:'wait',e:'Le prix touche le support, mais sans bougie de rejet : une grosse bougie rouge continue de tomber. Sans confirmation, on n’achète pas. Le niveau a cassé.'},B2,{z:null,c:[[50,51,49.5,50.5],[50.5,51,50,50.3],[50.3,60,44,48],[48,56,45,52]],f:[[52,54,50,51],[51,53,48,49]],a:'wait',e:'Grosse news : bougies énormes dans les deux sens, spread élargi, faux mouvements. On n’entre pas. On attend la stabilisation, puis une confirmation sur un niveau.'},mir(B2,'Tendance baissière, petit rebond sur la résistance, puis avalement baissier : confirmation. Vente valide, stop au-dessus de la mèche.')];
function sc(S,rev){
 const cs=rev?S.c.concat(S.f):S.c,N=S.c.length+S.f.length,W=320,H=200,all=S.c.concat(S.f).flat().concat(S.z?S.z.slice(0,2):[]),lo=Math.min(...all)-3,hi=Math.max(...all)+3;
 const y=p=>(H-10)-(p-lo)/(hi-lo)*(H-20),x=i=>20+i*(280/(N-1));
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 if(S.z)s+=`<rect x="0" y="${y(S.z[1])}" width="${W}" height="${y(S.z[0])-y(S.z[1])}" fill="${S.z[2]==='S'?'var(--up)':'var(--dn)'}" opacity=".18"/><text x="6" y="${y(S.z[1])-3}" font-size="9" fill="var(--mu)">${S.z[2]==='S'?'Support':'Résistance'}</text>`;
 cs.forEach((c,i)=>{const col=c[3]>=c[0]?'var(--up)':'var(--dn)';s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(c[2])}" y2="${y(c[1])}" stroke="${col}" stroke-width="2"/><rect x="${x(i)-7}" y="${y(Math.max(c[0],c[3]))}" width="14" height="${Math.max(2,Math.abs(y(c[0])-y(c[3])))}" fill="${col}"/>`});
 if(rev){const k=S.c.length-1;s+=`<line x1="${x(k)+10}" x2="${x(k)+10}" y1="0" y2="${H}" stroke="var(--ac)" stroke-dasharray="3 3"/>`;
  if(S.a!=='wait'){const b=S.a==='buy',e=S.c[k][3],sl=b?Math.min(S.c[k][2],S.c[k-1][2])-1:Math.max(S.c[k][1],S.c[k-1][1])+1,tp=e+(e-sl)*2,L=(p,c,t,d)=>`<line x1="${x(k)}" x2="${W}" y1="${y(p)}" y2="${y(p)}" stroke="${c}" stroke-width="1.5" ${d?'stroke-dasharray="4 3"':''}/><text x="${W-4}" y="${y(p)-3}" font-size="9" text-anchor="end" fill="${c}">${t}</text>`;s+=L(sl,'var(--dn)','Stop loss',1)+L(tp,'var(--up)','Take profit 1:2',1)+L(e,'var(--bl)','Entrée',0)}}
 return s+'</svg>';
}
function sim(){
 const S=SC[si];let h=`<p class="mu">Scénario ${si+1} sur ${SC.length} · Score ${ss}/${sn}</p>${sc(S,sa!==null)}`;
 if(sa===null)h+=`<p>Que fais-tu après la dernière bougie ?</p><div class="row"><button class="btn" style="background:var(--up)" onclick="ans('buy')">Acheter</button><button class="btn" style="background:var(--dn)" onclick="ans('sell')">Vendre</button></div><button class="btn g" onclick="ans('wait')">Attendre</button>`;
 else{const ok=sa===S.a;h+=`<div class="verdict" style="background:${ok?'var(--up)':'var(--dn)'};color:#111">${ok?'✅ Bonne décision':'❌ Mauvaise décision'}</div><div class="card"><p><b>Bonne réponse : ${{buy:'Acheter',sell:'Vendre',wait:'Attendre'}[S.a]}</b></p><p>${S.e}</p></div><button class="btn" onclick="si=(si+1)%SC.length;sa=null;go()">Scénario suivant</button>`}
 return h}
function ans(a){sa=a;sn++;if(a===SC[si].a)ss++;go()}
const Q=[['Le prix est entre deux niveaux, loin de tout support ou résistance. Que fais-tu ?',['J’achète vite','J’attends un niveau clé','Je vends'],1,'Jamais de trade au milieu de nulle part. On attend que le prix revienne sur un niveau.'],['Où placer le stop loss d’un achat après un pin bar sur un support ?',['Sous la mèche du rejet','Au milieu du corps de la bougie','Pas de stop loss'],0,'Le stop va juste au-delà du niveau ou de la mèche. Si le prix passe là, ton idée est fausse.'],['Quel ratio risque/gain minimum vises-tu ?',['1:0,5','1:2','Peu importe'],1,'Avec 1:2, tu peux perdre plus souvent que tu gagnes et rester dans le vert.'],['Quel risque maximum par trade ?',['1 à 2 % du capital','10 % du capital','La moitié du capital'],0,'Un petit risque te garde dans le jeu après une série de pertes.'],['Tu viens de perdre 2 trades de suite. Que fais-tu ?',['Je double le lot pour me refaire','J’arrête la journée','Je retire mon stop loss'],1,'Après 2 pertes de suite, on s’arrête. Vouloir se refaire est la plus grosse erreur.'],['Les emplois US (NFP) sont meilleurs que prévu. Réaction habituelle du dollar ?',['Il monte souvent','Il baisse toujours','Aucun effet jamais'],0,'Dollar plus fort : l’or et l’EURUSD baissent souvent. C’est une tendance, pas une garantie.'],['Quelles sessions sont les plus actives ?',['Londres et New York','Seulement l’Asie','Le week-end'],0,'Plus de volume, plus de mouvement. La session d’Asie est plus calme.'],['Une grosse news sort dans 10 minutes. Que fais-tu ?',['J’ouvre plusieurs trades','J’attends la stabilisation','Je retire mon stop'],1,'Spikes, faux mouvements et spread large. On attend, puis on cherche une confirmation.'],['À quoi sert la bougie de confirmation sur M1 ?',['À voir que le niveau réagit vraiment','À élargir le spread','À rien'],0,'Elle prouve que les acheteurs ou vendeurs défendent le niveau avant d’entrer.']];
const QI={0:()=>sc(SC[1],false),1:()=>chart('buy',9),2:()=>chart('buy',9),7:()=>sc(SC[5],false),8:()=>chart('buy',6)};
function quiz(){
 if(qi>=Q.length)return `<div class="verdict" style="background:var(--ac);color:#111">Score : ${qs}/${Q.length}</div><p>${qs>=7?'Très bien, tu maîtrises les règles.':'Relis le cours, puis recommence.'}</p><button class="btn" onclick="qi=0;qa=null;qs=0;go()">Recommencer</button>`;
 const q=Q[qi];
 return `<p class="mu">Question ${qi+1} sur ${Q.length}</p><div class="card"><b>${q[0]}</b></div>${QI[qi]?QI[qi]():''}`+q[1].map((o,i)=>`<button class="btn g" style="${qa!==null?(i===q[2]?'background:var(--up);color:#111':i===qa?'background:var(--dn);color:#111':''):''}" ${qa!==null?'disabled':''} onclick="qpick(${i})">${o}</button>`).join('')+(qa!==null?`<div class="card"><p>${q[3]}</p></div><button class="btn" onclick="qi++;qa=null;go()">${qi===Q.length-1?'Voir mon score':'Question suivante'}</button>`:'');
}
function qpick(i){qa=i;if(i===Q[qi][2])qs++;go()}
function prat(){return `<h1>Pratique</h1><div class="row seg" style="margin:10px 0">${[['sim','Simulateur'],['quiz','Quiz']].map(a=>`<button class="${pm===a[0]?'on':''}" onclick="pm='${a[0]}';go()">${a[1]}</button>`).join('')}</div>`+(pm==='sim'?sim():quiz())}
let samp=null,msgs=[],busy=false;
try{claude.use('sample').then(s=>{samp=s;if(tab==='coach')go()}).catch(()=>{})}catch(e){}
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const SYS=`Tu es Trading Coach, un coach de trading pour un débutant qui scalpe XAUUSD et EURUSD sur MetaTrader 5 (M1/M5). Réponds en français simple, en 120 mots maximum, avec des exemples concrets. Enseigne uniquement la stratégie Support/Résistance + Confirmation : tendance M15, niveaux clés, attente, bougie de rejet sur M1, stop loss obligatoire, ratio 1:2 minimum, risque de 1 à 2 % par trade, arrêt après 2 pertes de suite, aucun trade pendant les grosses news. Rappelle toujours le stop loss et le risque. Ne donne jamais de signal d'achat ou de vente garanti et ne promets jamais de gains. Si l'élève veut trader sans stop loss, doubler son lot pour se refaire ou risquer trop, refuse gentiment et explique pourquoi.`;
const CH=['Explique-moi une pin bar avec un exemple','Pourquoi l’or réagit aux news américaines ?','Analyse mon journal de trades'];
const chatH=()=>msgs.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)||'…'}</div>`).join('');
function upd(){const c=$('#ch');if(c){c.innerHTML=chatH();scrollTo(0,document.body.scrollHeight)}}
async function ask(i){
 if(!samp||busy)return;
 let shown=i!==undefined?CH[i]:$('#ci').value.trim();if(!shown)return;let t=shown;
 if(i===2)t=jr.length?'Analyse mes derniers trades et dis-moi ce que je dois corriger. '+JSON.stringify(jr.slice(-8).map(a=>({paire:a.p,sens:a.s,resultat:a.r,emotion:a.e,stop:a.sl}))):'Mon journal est vide. Que dois-je noter à chaque trade ?';
 if(i===undefined)$('#ci').value='';
 msgs.push({role:'user',content:shown,send:t},{role:'assistant',content:''});busy=true;upd();
 const hist=msgs.slice(0,-1).slice(-10).map(m=>({role:m.role,content:m.send||m.content}));
 while(hist[0].role!=='user')hist.shift();
 hist[0]={role:'user',content:SYS+'\n\nQuestion : '+hist[0].content};
 try{const r=await samp(hist,{cache:false,onText:({text})=>{msgs[msgs.length-1].content=text;upd()}});msgs[msgs.length-1].content=r.text}
 catch(e){msgs[msgs.length-1].content='Le coach n’a pas pu répondre ('+((e&&e.code)||'erreur')+'). Réessaie dans un moment.'}
 busy=false;upd();
}
function coach(){
 return `<h1>Coach IA</h1><p class="mu">Pose tes questions sur la stratégie, les news ou tes trades.</p>${samp?'':'<p class="no">Le coach IA n’est pas disponible ici. Ouvre l’app depuis ton compte Claude pour l’activer.</p>'}${CH.map((t,i)=>`<button class="btn g" style="padding:10px;font-weight:400" onclick="ask(${i})">${t}</button>`).join('')}<div id="ch">${chatH()}</div><div class="row" style="margin-top:10px"><input id="ci" placeholder="Ta question…" onkeydown="if(event.key==='Enter')ask()" style="flex:3"><button class="btn" style="flex:1;margin:4px 0 8px" onclick="ask()">Envoyer</button></div><p class="warn">Le coach explique et enseigne. Il ne donne aucun signal garanti. Le trading comporte un risque de perte en capital.</p>`;
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9: ]/g,' ');
const KB=[
['Bonjour / aide','bonjour,salut,bonsoir,aide,help','Salut ! Écris un mot (spread, stop loss, lot, NFP…) ou une question, et je te réponds avec mon dictionnaire de trading.'],
['Pip','pip,pips,point','Un pip est la plus petite unité de mouvement standard. Sur EURUSD, c’est 0,0001. Sur l’or, vérifie dans ton MT5 comment ton broker compte les points.'],
['Lot','lot,lots,taille de lot,0.01,micro lot','Le lot est la taille de ta position. 0,01 lot est un micro lot. Plus le lot est grand, plus tes gains et tes pertes sont grands pour le même mouvement.'],
['Spread','spread,bid,ask','Le spread est l’écart entre le prix d’achat et le prix de vente. C’est le coût d’entrée de chaque trade. Il s’élargit pendant les grosses news.'],
['Levier','levier,leverage','Le levier te permet d’ouvrir une grande position avec peu d’argent. Il multiplie aussi les pertes. Un levier élevé n’est pas une raison de prendre un gros lot.'],
['Marge et stop out','marge,margin,margin call,stop out','La marge est l’argent bloqué pour garder tes positions ouvertes. Si ton compte tombe trop bas, le broker ferme tes trades de force (stop out).'],
['Stop loss','stop loss,stop,sl,sans stop','Le stop loss ferme le trade automatiquement à ta perte maximale. Place-le juste au-delà du niveau ou de la mèche. Jamais sans stop, et ne l’éloigne jamais.'],
['Take profit','take profit,tp,objectif de gain','Le take profit ferme le trade automatiquement au gain visé. Vise le prochain niveau clé, avec au moins 2 fois ton risque.'],
['Ratio risque/gain','ratio,risque gain,rr,1:2,1 pour 2','Le ratio compare ce que tu risques à ce que tu peux gagner. À 1:2, tu gagnes 2 $ pour 1 $ risqué. Avec 1:2, environ 40 % de trades gagnants suffisent pour être positif, avant frais.'],
['Risque par trade','risque,combien risquer,pourcentage,pourcent','Risque 1 à 2 % de ton capital au maximum par trade. Avec 100 $, cela fait 1 à 2 $ de perte maximale si ton stop est touché.'],
['Calculer le lot','calculer lot,combien de lot,quel lot,taille de position','Lot = (capital × % de risque) ÷ (distance du stop × valeur du mouvement). Utilise l’onglet Lot pour le faire automatiquement.'],
['Support','support','Un support est une zone où le prix a rebondi vers le haut au moins 2 fois. Les acheteurs y sont actifs. On cherche des achats avec confirmation sur un support.'],
['Résistance','resistance','Une résistance est une zone où le prix a été repoussé vers le bas au moins 2 fois. On cherche des ventes avec confirmation sur une résistance.'],
['Tendance','tendance,trend,haussier,baissier,sommet,creux','Tendance haussière : sommets et creux de plus en plus hauts. Baissière : de plus en plus bas. Trade dans le sens de la tendance. Sans tendance claire, ne trade pas.'],
['Pin bar','pin bar,pinbar,rejet,meche,marteau','Une pin bar a un petit corps et une longue mèche. Sur un support, la mèche vers le bas montre que les vendeurs ont été repoussés. C’est une confirmation possible, pas une garantie.'],
['Avalement','avalement,engulfing','Une bougie d’avalement a un corps qui couvre entièrement celui de la bougie d’avant. Sur un niveau clé, c’est un signal de retournement.'],
['Doji','doji,indecision','Un doji a un corps minuscule : le marché hésite. Seul, ce n’est pas un signal. Regarde où il se trouve et quelle bougie le suit.'],
['Bougie japonaise','bougie,chandelier,candle,corps','Une bougie montre l’ouverture, le plus haut, le plus bas et la clôture. Le corps relie ouverture et clôture, les mèches montrent les extrêmes. Vert : hausse. Rouge : baisse.'],
['Timeframes','timeframe,m1,m5,m15,h1,unite de temps','M1 = une bougie par minute, M5 = 5 minutes, M15 = 15 minutes. Avec cette stratégie : tendance et niveaux sur M15, confirmation et entrée sur M1 ou M5.'],
['Scalping','scalping,scalp,scalper','Le scalping vise des trades très courts. Le spread pèse beaucoup et il faut une discipline stricte. Un stop loss est encore plus important, car tout va vite.'],
['Day trading et swing','day trading,swing,long terme,intraday','Day trading : on ouvre et on ferme dans la journée. Swing : on garde plusieurs jours. Le scalping est encore plus court que le day trading.'],
['Breakout (cassure)','breakout,cassure,casse','Un breakout, c’est quand le prix casse un niveau. Beaucoup de cassures sont fausses. Attends une clôture au-delà du niveau et un retest avant d’agir.'],
['Faux breakout','faux breakout,fakeout,fausse cassure,piege','Le prix casse un niveau puis revient vite : ça piège ceux qui sont entrés trop tôt. Attendre la confirmation protège de ce piège.'],
['Retest et pullback','retest,pullback,retracement,retour','Un pullback est un petit recul du prix dans une tendance. Un retest est un retour sur un niveau cassé. Ce sont de bons endroits pour chercher une confirmation.'],
['Volatilité','volatilite,volatil,atr,mouvement fort','La volatilité mesure l’amplitude des mouvements. Plus elle est forte, plus il y a d’occasions et de risque. Adapte ton stop et réduis ton lot si ça bouge fort.'],
['Sessions de marché','session,londres,new york,asie,heure,quand trader,meilleure heure','L’Asie est calme. Londres et New York sont les plus actives, surtout quand elles se chevauchent. L’or et l’EURUSD bougent le plus à ces heures.'],
['NFP','nfp,emploi,non farm,emplois','Le NFP est le rapport sur l’emploi américain, publié le 1er vendredi du mois. Très volatil. Meilleur que prévu : le dollar monte souvent, l’or et l’EURUSD baissent.'],
['CPI et inflation','cpi,inflation','Le CPI mesure l’inflation américaine. Inflation plus forte que prévu : attentes de taux élevés, dollar souvent en hausse, or et EURUSD sous pression.'],
['Fed et taux d’intérêt','fed,fomc,taux,taux d interet,banque centrale','La Fed fixe les taux américains. Taux plus hauts ou ton ferme : dollar fort. Ton prudent ou baisse de taux : dollar faible, l’or et l’EURUSD montent souvent.'],
['BCE','bce,ecb,banque centrale europeenne','La BCE fixe les taux de la zone euro. Ton ferme : l’euro se renforce et l’EURUSD monte souvent. Compare toujours avec la Fed.'],
['Dollar et or','dollar,dxy,pourquoi l or,or monte,or baisse','L’or est coté en dollars. En général, dollar fort : or en baisse. Dollar faible : or en hausse. Il y a des exceptions, surtout en cas de crise.'],
['Valeur refuge','valeur refuge,guerre,crise,safe haven,peur','En période de peur ou de crise, les investisseurs achètent de l’or pour se protéger. Il peut monter même quand le dollar monte aussi.'],
['EURUSD','eurusd,euro dollar,eur usd','L’EURUSD est la paire la plus échangée au monde. Son spread est faible et le pip vaut 0,0001. Elle réagit surtout aux décisions de la Fed et de la BCE.'],
['XAUUSD (or)','xauusd,or,gold,xau','XAUUSD est le prix d’une once d’or en dollars. Il est très volatil et son spread est plus large que sur l’EURUSD. Prends un petit lot et un stop adapté.'],
['News et calendrier','news,annonce,calendrier economique,trader pendant news','Avant chaque session, regarde le calendrier économique. Pas de trade juste avant ou pendant une grosse news. Attends la stabilisation puis cherche une confirmation sur un niveau.'],
['Psychologie','psychologie,emotion,peur,avidite,discipline,stress','Les deux ennemis sont la peur et l’avidité. Un plan écrit et la checklist avant chaque trade protègent de tes émotions. Si tu es énervé ou pressé, ne trade pas.'],
['Revenge trading','revenge,se refaire,vengeance,doubler le lot,martingale','Ne double jamais ton lot pour te refaire. La martingale mène à la ruine du compte. Après 2 pertes de suite, arrête la journée.'],
['Overtrading','overtrading,trop de trades,plusieurs positions,plusieurs trades','Plus de trades ne veut pas dire plus de gains. Ouvrir plusieurs positions en même temps revient à prendre un seul gros risque. Un seul trade à la fois, avec un stop.'],
['Journal de trading','journal,carnet,statistiques,statistique','Note chaque trade : paire, sens, résultat, émotion, stop utilisé. Après 20 trades, tu verras tes erreurs répétées. C’est comme ça qu’on progresse.'],
['Compte démo','demo,compte demo,debutant,commencer,debuter','Commence en démo pour t’entraîner à suivre ta stratégie sans risque. Passe en réel avec un petit capital et un petit lot quand tu respectes tes règles de façon régulière.'],
['Choisir un broker','broker,courtier,regule,arnaque,scam','Choisis un broker régulé et vérifie les frais et les retraits. Méfie-toi des signaux payants, des comptes gérés et de toute promesse de gains garantis.'],
['Gains et réalité','gain garanti,strategie secrete,devenir riche,combien gagner,signal,rapidement','Aucune stratégie ne gagne à chaque fois. La plupart des débutants perdent au début. L’objectif du début est d’apprendre et de protéger ton capital, pas de gagner vite.'],
['Bot de trading','bot,robot,ea,expert advisor,automatique','Un bot exécute des règles, il ne crée pas d’avantage. Beaucoup de bots vendus en ligne sont des arnaques. Comprends d’abord ta stratégie à la main.'],
['Break-even','break even,breakeven,trailing,deplacer stop,securiser','Quand le prix a avancé de la valeur de ton risque, tu peux déplacer ton stop à ton prix d’entrée (break-even). Ne l’éloigne jamais dans le sens de la perte.'],
['Fermer à la main','fermer manuellement,couper,panique,fermer a la main','Fermer à la main sans stop, c’est décider avec la peur ou l’avidité. Mets un stop et un take profit dès l’ouverture. Ta perte maximale est alors connue.'],
['Types d’ordres','ordre,market,limit,buy limit,sell limit,buy stop,sell stop','Ordre au marché : immédiat. Limit : au prix que tu veux, mieux que le marché. Stop : se déclenche quand le prix casse un niveau. Un stop loss est un ordre de sortie.'],
['Swap','swap,nuit,overnight','Le swap est un frais ou un gain pour garder une position ouverte la nuit. Le scalping de quelques minutes n’est pas concerné.'],
['Drawdown','drawdown,serie de pertes,perte maximale','Le drawdown est la baisse de ton capital depuis son sommet. Un risque de 1 à 2 % par trade et l’arrêt après 2 pertes limitent les dégâts.'],

['Plan de trading','plan,routine,regles,strategie','Ton plan : tendance M15, niveau clé, attente, rejet sur M1, stop loss, take profit 1:2, risque 1 à 2 %, stop après 2 pertes. Écris-le et suis la checklist avant chaque trade.']
];
KB.forEach(e=>e[1]=e[1].split(',').map(norm));
function kfind(q){q=' '+norm(q).replace(/\s+/g,' ').trim()+' ';const w=q.trim().split(' ').filter(x=>x.length>3);
 return KB.map(e=>{let s=0;e[1].forEach(k=>{k=k.trim();if(k&&q.includes(' '+k+' '))s+=3;else if(k.length>3&&q.includes(k))s+=1});const t=norm(e[0]);w.forEach(x=>{if(t.includes(x))s++});return[s,e]}).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,3).map(a=>a[1])}
function kres(q){
 if(!q.trim())return `<p class='mu'>Écris ta question ci-dessus, ou ouvre un sujet :</p>`+KB.map(e=>`<details><summary>${e[0]}</summary><p>${e[2]}</p></details>`).join('');
 const r=kfind(q);
 return r.length?r.map(e=>`<div class='card'><b>${e[0]}</b><p>${e[2]}</p></div>`).join('')+`<p class='mu'>Autre sujet ? Précise avec un mot clé (ex. stop loss, spread, NFP).</p>`:`<div class='card'><p>Je n’ai pas cette réponse dans mon dictionnaire. Essaie un mot clé : stop loss, lot, spread, pin bar, NFP, risque.</p></div>`;
}
function kc(){$('#kr').innerHTML=kres($('#kq').value)}
function kcoach(){return `<h1>Coach</h1><p class='mu'>Dictionnaire de trading hors ligne : écris un mot ou une question.</p><input id='kq' placeholder='Ex. c’est quoi le spread ?' oninput='kc()'><div id='kr'>${kres('')}</div><p class='warn'>Ce coach répond avec un dictionnaire de ${KB.length} sujets, sans internet, sans IA et sans clé. Il ne donne aucun signal d’achat ou de vente. Le trading comporte un risque de perte en capital.</p>`}
const V={cours,check,lot,journ,news,prat,coach:kcoach};
function go(){
 const y=window.scrollY;
 $('#n').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';go();scrollTo(0,0)"><b>${t[1]}</b>${t[2]}</button>`).join('');
 const a=document.activeElement,id=a&&a.tagName==='INPUT'&&a.type!=='checkbox'?a.value:null;
 $('#v').innerHTML=V[tab]();scrollTo(0,y);
}
go();
</script>
